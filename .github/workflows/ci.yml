name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dataset-tools:
    name: Dataset tools (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test data preparation without GPU dependencies
        run: python -m unittest discover -s tests -v
      - name: Check training CLI
        run: python D2C2/train/train_yolov5.py --help
      - name: Check shell syntax
        run: bash -n D2C2/scripts/convert_to_tensorrt.sh

  ros-unit-tests:
    name: ROS2 Humble unit tests (CPU)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: ros-tooling/setup-ros@v0.7
        # Configure repositories/build tools; install ros-base below, not the desktop variant.
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ros-humble-ros-base ros-humble-ament-cmake-gtest \
            python3-colcon-common-extensions libopencv-dev libyaml-cpp-dev
      - name: Build without CUDA or TensorRT
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select tdt_interface go --cmake-args \
            -DBUILD_RUNTIME=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Run all C++ unit tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --packages-select go --return-code-on-test-failure
          colcon test-result --all --verbose
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros-unit-test-results
          path: build/go/test_results/
          if-no-files-found: ignore
          retention-days: 7
