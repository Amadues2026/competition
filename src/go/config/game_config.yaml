  - x: -5.8
    y: 44.9
    yaw: 0.0
    pitch: 0.0
    has_shoot_task: false  # P2 - 向中部移动
  - x: -5.8
    y: 37.8
    yaw: 0.0
    pitch: 0.0
    has_shoot_task: false  # P3 - 接近中部
  - x: 27.7
    y: 38.3
    yaw: 243.0
    pitch: -1.5
    has_shoot_task: true   # 攻击5号敌人
  - x: 27.2
    y: 2.4
    yaw: 89.5
    pitch: 2.5
    has_shoot_task: true   # 攻击4号敌人
  - x: 2.5
    y: 2.8
    yaw: 58.7
    pitch: 19.5
    has_shoot_task: true   # 攻击前哨站
  - x: 3.0
    y: -32.0
    yaw: 112.8
    pitch: 8.0
    has_shoot_task: true   # 敌方基地
  - x: -6.8
    y: -32.0
    yaw: 48.5
    pitch: 8.0
    has_shoot_task: true   # 敌方基地
  - x: -6.8
    y: -47.5
    yaw: 314.0
    pitch: 8.0
    has_shoot_task: true   # 敌方基地
  - x: 6.0
    y: -47.5
    yaw: 221.0
    pitch: 8.0
    has_shoot_task: true   # P10 - 攻击基地
