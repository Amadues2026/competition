# Health-change thresholds
health_change_thresholds:
  p4: -50   # Health-change threshold for P4
  p5: 0     # Health-change threshold for P5
  p6: -60   # Health-change threshold for P6
  base: -120 # Health-change threshold for the base

# Speed parameters
speed:
  max_far: 10.0       # Far speed before meter_to_map_unit scaling (m/s)
  max_near: 3.0       # Near speed before meter_to_map_unit scaling (m/s)
  switch_distance: 5.0         # Speed-switch distance (map units)
  switch_distance_fast: 10.0   # Speed-switch distance in fast mode (map units)
  precise_mode_distance: 1.5   # Precise-mode distance (map units)
  arrival_threshold_fast: 2.0  # Fast arrival threshold (map units)
  arrival_threshold_normal: 0.8 # Normal arrival threshold (map units)
  precise_arrival_threshold: 0.2 # Precise arrival threshold (map units)
  precise_adjust_speed: 0.3    # Precise speed before meter_to_map_unit scaling (m/s)

# Camera intrinsics
camera:
  fx: 554.26   # Horizontal focal length (pixels)
  fy: 554.26   # Vertical focal length (pixels)
  cx: 320.0    # Principal point x (pixels)
  cy: 240.0    # Principal point y (pixels)

# Armor geometry
armor:
  width: 1.0     # Armor width (map units)
  height: 0.625  # Armor height (map units)

# Simulator ballistic parameters; verify the simulator unit convention before deployment
ballistics:
  bullet_speed: 23.0  # Configured projectile speed (passed through without conversion)
  gravity: 5.0        # Configured gravity (passed through without conversion)

# Position adjustment
position_adjust:
  hold_threshold: 0.05      # Position-hold threshold (map units)
  adjust_interval: 1.0       # Position-adjustment interval (seconds)

# Sweep parameters
swing:
  range: 6.0        # Sweep range (+/- degrees)
  speed: 10.0       # Sweep speed (degrees/second)

# Detection failure handling
detection_failure:
  max_fail_count: 10  # Maximum consecutive detection failures

# Timeouts
timeout:
  move: 10.0            # Movement timeout (seconds)
  health_history: 5.0   # Health history duration (seconds)
  other_data: 10.0      # Other history duration (seconds)

# Task thresholds
threshold:
  consecutive_miss_disable: 10  # Consecutive misses before disabling automatic aiming
  consecutive_miss_swing: 3     # Consecutive misses before sweep mode

# Distance gating
distance_gate:
  default_detection_distance: 3.5  # Default distance when no detection is available
  gate_max: 30.0                   # Reject distances above this limit
  gate_acceptance: 10.0            # Maximum accepted inter-frame distance jump

# Filter parameters
filter:
  distance_window: 150   # Distance median-filter window (frames)

# Unit conversion
unit:
  meter_to_map_unit: 5.0    # 1 meter = 5 map units

# EKF parameters
ekf:
  q_yaw: 0.01           # Yaw process noise
  q_pitch: 0.01         # Pitch process noise
  q_distance: 0.5       # Distance process noise
  r_yaw: 0.004          # Yaw measurement noise
  r_pitch: 0.004        # Pitch measurement noise
  r_distance_denom: 200.0  # Adaptive distance-noise denominator
  r_distance_base: 0.09    # Adaptive distance-noise base
  p0_yaw: 0.01          # Initial yaw covariance
  p0_pitch: 0.01        # Initial pitch covariance
  p0_distance: 0.1      # Initial distance covariance
  p_reset: 1000.0       # Covariance multiplier on reset
  q_adaptive_alpha: 0.0  # Adaptive Q coefficient (0 disables; scales by normalized innovation)
  q_adaptive_max_scale: 10.0  # Maximum adaptive Q multiplier

# NIS chi-square test
nis:
  chi2_upper: 7.815     # NIS upper bound (3 degrees of freedom, 95th percentile)
  window: 100           # NIS failure-rate window

# Tracking state machine
tracking:
  min_detect_count: 3       # Consecutive detections required for DETECTING -> TRACKING
  max_temp_lost_count: 15   # Maximum missed frames in TEMP_LOST
  nis_failure_max: 0.3      # NIS failure-rate threshold

# Detection parameters
detection:
  conf_threshold: 0.1       # YOLO confidence threshold
  nms_iou_threshold: 0.45   # NMS IoU threshold
  enable_visualization: true   # Enable GUI; disable for headless operation

# Timer intervals (milliseconds)
timer:
  control: 5           # Movement control period (ms)
  shoot: 30            # Detection period (ms)
  health_check: 1000   # Health-monitoring period (ms)
  swing: 20            # Sweep/task-command period (ms)
  visualization: 67    # GUI refresh interval (ms; about 15 FPS, separate worker)

# Drift detection
drift:
  threshold_multiplier: 2.0  # Drift threshold = arrival_threshold times this value
  timeout: 5.0               # Drift timeout (seconds)

# Target-lock multiplier
lock:
  speed_multiplier: 2.0  # Scale speed-switch and precise-mode distances while locked

# Data history
data:
  max_reasonable_health_change: 500  # Maximum accepted health change per sample
  health_history_tolerance: 0.1      # Health-history window tolerance (seconds)
  max_health_changes: 10             # Maximum health-change records
  yaw_pitch_lookback: 1.0            # Angle-history lookback (seconds)

# Navigation
navigator:
  max_retry_count: 3     # Maximum retries when stuck

# Task manager parameters
combat:
  ekf_default_dt: 0.03   # Default EKF time step (seconds)
  ekf_max_dt: 0.5        # Maximum EKF time step (seconds)
  debug_log_interval: 30  # Debug-log interval (frames)

# Waypoint utilities
waypoint:
  health_ratio_escape: 0.2       # Health-ratio threshold for retreat
  health_change_fallback: 50     # Fallback health-change threshold
